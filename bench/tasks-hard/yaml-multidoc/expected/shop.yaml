apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-shared
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
data:
  LOG_FORMAT: json
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317
  DATABASE_HOST: postgres.shop.svc.cluster.local
  DATABASE_PORT: "5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: shop
    team: orders
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/part-of: shop
        team: orders
    spec:
      serviceAccountName: orders
      containers:
        - name: app
          image: registry.example.com/shop/orders-api:1.8.2
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shop-shared
          env:
            - name: LOG_LEVEL
              value: info
            - name: WORKER_CONCURRENCY
              value: "4"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: shop
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: shop
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: http
      port: 443
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  namespace: shop
  labels:
    app.kubernetes.io/name: orders-worker
    app.kubernetes.io/part-of: shop
    team: orders
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-worker
        app.kubernetes.io/part-of: shop
        team: orders
    spec:
      serviceAccountName: orders
      containers:
        - name: app
          image: registry.example.com/shop/orders-worker:1.8.2
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shop-shared
          env:
            - name: LOG_LEVEL
              value: info
            - name: WORKER_CONCURRENCY
              value: "4"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders-worker
  namespace: shop
  labels:
    app.kubernetes.io/name: orders-worker
    app.kubernetes.io/part-of: shop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-worker
  ports:
    - name: http
      port: 80
      targetPort: http
---
