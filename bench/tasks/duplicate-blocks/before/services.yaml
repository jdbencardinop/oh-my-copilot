# Service deployment settings. Each block is applied as-is by the deploy job.
services:
  auth:
    image: registry.example.com/shop/auth:v1.4.2
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
      LOG_LEVEL: info
      TIMEOUT_SECONDS: "30"
    healthcheck:
      path: /healthz
      intervalSeconds: 10
  billing:
    image: registry.example.com/shop/billing:v1.4.2
