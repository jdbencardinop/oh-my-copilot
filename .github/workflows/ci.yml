name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  discovery:
    name: Offline plugin discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Copilot CLI
        # Keep this version compatible with the locked @microsoft/copilot-sdk.
        run: npm install -g @github/copilot@1.0.114
      # Loads ./plugin in a throwaway COPILOT_HOME with no sign-in and a local
      # provider that rejects all requests, so no model is called.
      - run: npm run test:discovery -- --require

  release-tag:
    name: Tag matches plugin version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag and plugin.json version
        run: |
          expected="v$(node -p "require('./plugin/plugin.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin version $expected"
            exit 1
          fi
